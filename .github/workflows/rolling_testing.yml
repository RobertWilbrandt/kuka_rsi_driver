name: Rolling build - Testing

on:
  workflow_dispatch:
  pull_request:
  push:
  schedule:
    - cron: "10 4 * * *"

jobs:
  build:
    uses: ./.github/workflows/industrial_ci.yml
    with:
      ros_distro: rolling
      ros_repo: testing
      upstream_exclude: -kuka_experimental/kuka_experimental -kuka_experimental/kuka_ros2_control_support -kuka_experimental/kuka_rsi_simulator -kuka_experimental/kuka_common_moveit
